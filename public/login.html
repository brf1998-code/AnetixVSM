<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbiotic OS · Sign in</title>
<link rel="icon" href="/assets/anetix-mark.svg" type="image/svg+xml">
<style>
  :root { --ink:#1c242e; --steel:#51606f; --line:#d5dbe3; --fog:#f2f4f7; --navy:#1f3a5f; --red:#b3261e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--fog); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--steel); font-size:13px; margin-bottom:18px; }
  input { width:100%; font-size:18px; padding:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  button { width:100%; margin-top:12px; background:var(--navy); color:#fff; border:none; border-radius:8px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  .err { color:var(--red); font-size:13px; margin-top:10px; display:none; }
  .staff { display:block; margin-top:16px; font-size:12px; color:var(--steel); text-align:center; }
  #code { letter-spacing:.2em; text-align:center; }
  .hint { color:var(--steel); font-size:12.5px; margin:10px 0 6px; line-height:1.45; }
  .hint a { color:var(--navy); }
  .remember { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--steel); margin:10px 0 2px; line-height:1.45; cursor:pointer; }
  .remember input { width:18px; height:18px; margin:1px 0 0; flex:none; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1><img src="/assets/anetix-mark.svg" alt="Anetix" style="width:34px;height:34px;border-radius:8px;vertical-align:middle;margin-right:10px">Symbiotic OS</h1>
    <div class="sub" id="sub">Enter the password you were given. Floor and manager passwords both work here.</div>
    <input id="co" type="text" placeholder="Company code" autocomplete="organization" autocapitalize="none" spellcheck="false" style="display:none;margin-bottom:10px">
    <input id="nm" type="email" placeholder="Your name (email address)" autocomplete="username" autocapitalize="none" spellcheck="false" style="display:none;margin-bottom:10px">
    <input id="pw" type="password" placeholder="Password" autofocus autocomplete="current-password">
    <div id="codebox" style="display:none">
      <div class="hint" id="codehint">Type the 6 digit code your authenticator app shows for Anetix SOS.</div>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digit code" maxlength="24" spellcheck="false">
      <label class="remember" id="rememberbox"><input type="checkbox" id="remember"><span id="rememberlabel">Remember this computer for 30 days: no code at sign-in from this browser. Sign out everywhere on the Accounts tab ends it.</span></label>
      <div class="hint"><a href="#" id="userec">Phone not with you? Use a recovery code</a></div>
    </div>
    <button type="submit">Sign in</button>
    <div class="err" id="err">That password did not match.</div>
    <a href="#" class="staff" id="staff">Sign in with an account (managers, Anetix staff)</a>
  </form>
<script>
// A login belongs to one company. The link or the wall code that brought the
// person here names it (/c/<company>/...); the box only shows when nothing does.
const params = new URLSearchParams(location.search);
const next = params.get("next");
const fromNext = /^\/c\/([a-z0-9][a-z0-9-]{1,40})(?:\/|$)/.exec(next || "");
let company = (params.get("c") || (fromNext && fromNext[1]) || "").toLowerCase();
const co = document.getElementById("co"), err = document.getElementById("err");
const nm = document.getElementById("nm"), code = document.getElementById("code"), codebox = document.getElementById("codebox"), sub = document.getElementById("sub");
if (company) sub.textContent = "Signing in to " + company + ". Enter the password you were given. Floor and manager passwords both work here.";
// Anetix's own people sign in by name, with a code from an authenticator app after the password. The floor never
// needs this, so it stays behind a small link (and opens by itself when the link that brought you here was /admin).
let staff = false;
function staffMode(login) {
  staff = true; nm.style.display = "block"; co.style.display = "none"; document.getElementById("staff").style.display = "none";
  // a manager account (a company from anetix.ai, 2026-09-25) signs in the same way: email, password, the app's code
  sub.textContent = login ? "Your account: the email address, your password, then the code from your authenticator app (set up on the first sign-in)." : "Anetix staff: your own name and password, then the code from your authenticator app.";
  if (login) { nm.value = login; document.getElementById("pw").focus(); } else nm.focus();
}
document.getElementById("staff").onclick = (e) => { e.preventDefault(); staffMode(); };
if (/^\/admin(?:[/?#]|$)/.test(next || "")) staffMode();
else if (params.get("account")) staffMode(params.get("account"));
else if (params.get("staff")) { staffMode(); sub.textContent = "Your email (or name) and password, then the code from your authenticator app."; }   // signed out of an account: back to the account form
else if (company) {
  // a personal demo has no company password, only its manager's account: open that form at once instead of the
  // password box (which would only ever answer "did not match")
  fetch("/login/mode?c=" + encodeURIComponent(company)).then((r) => r.json()).then((j) => { if (j.mode === "account" && !staff) { staffMode(); sub.textContent = "Sign in to " + company + " with your email and password, then the code from your authenticator app."; } }).catch(() => {});
}
// recovery is for getting back in, not for minting a trusted device: the box goes when a recovery code is chosen
let recovery = false;
document.getElementById("userec").onclick = (e) => {
  e.preventDefault(); recovery = true; document.getElementById("remember").checked = false; document.getElementById("rememberbox").style.display = "none";
  code.value = ""; code.inputMode = "text"; code.style.letterSpacing = "normal"; code.placeholder = "recovery code";
  document.getElementById("codehint").textContent = "Type one of the recovery codes you saved when you set the app up. Each works once."; code.focus();
};
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  if (!staff && co.style.display !== "none") company = co.value.trim().toLowerCase();
  const onCode = codebox.style.display !== "none";
  const body = staff ? { name: nm.value.trim(), password: document.getElementById("pw").value, code: onCode ? code.value.trim() : "", remember: onCode && !recovery && document.getElementById("remember").checked }
    : { password: document.getElementById("pw").value, company };
  const res = await fetch("/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if (staff && (j.need_code || !res.ok)) {
    // the password was right and the account has an authenticator: ask for the code, then send all three together
    if (j.need_code) {
      const first = codebox.style.display === "none"; codebox.style.display = "block"; code.focus(); code.select();
      if (j.remember_days) document.getElementById("rememberlabel").textContent = "Remember this computer for " + j.remember_days + " days: no code at sign-in from this browser. Sign out everywhere on the Accounts tab ends it.";
      if (first && res.ok) { err.style.display = "none"; return; }
    }
    err.textContent = j.error ? j.error.charAt(0).toUpperCase() + j.error.slice(1) + (/[.!]$/.test(j.error) ? "" : ".") : "That did not match.";
    err.style.display = "block"; return;
  }
  if (!res.ok) {
    if (j.need_company) { co.style.display = "block"; co.focus(); }
    err.textContent = res.status === 429 ? (j.error || "Too many tries. Wait a few minutes.") : j.need_company ? "Which company is this login for? Type its code, the word after /c/ in its address." : "That password did not match.";
    err.style.display = "block"; return;
  }
  if (staff && j.role === "manager") {   // a manager account: its enrollment first, else the page asked for inside its company, else its board
    const own = "/c/" + j.company + "/";
    location.href = j.enroll ? (j.enroll_url || own + "enroll") : next && next.startsWith(own) ? next : own; return;
  }
  if (staff) { location.href = next && /^\/(?!\/)/.test(next) && !j.enroll ? next : "/admin"; return; }
  // a company login lands on its own board unless the link asked for a page inside that company
  const own = j.company ? "/c/" + j.company + "/" : "/";
  location.href = next && next.startsWith("/") && !next.startsWith("//") && (!j.company || next.startsWith(own)) ? next : own;
};
</script>
</body>
</html>
