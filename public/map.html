<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/assets/anetix-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/anetix-touch-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anetix · Value stream map</title>
<!-- The value stream map, the board's other view (src/vsm.js, docs/VSM.md, milestone M1). Managers and admins.
     Information on top, material below, inventory between steps, the timeline ladder at the bottom; every box
     colored by where its record lives. Built with the board's own look (principles/STYLE.md). -->
<style>
  :root { --ink:#1c242e; --steel:#51606f; --line:#d5dbe3; --fog:#f2f4f7; --navy:#1f3a5f; --amber:#c2620a; --amberDeep:#9a4a05;
          --green:#2e7d4f; --greenSoft:#e3efe7; --red:#b3261e; --gold:#e8b04a;
          --anetix:#1f3a5f; --next:#dfe7f1; --other:#a9bccd; --paper:#f5cf9f; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--fog); color:var(--ink); padding:0 0 56px; font-size:13px; line-height:1.45; }
  a { color:var(--navy); }
  button { font:inherit; }
  .band { background:var(--navy); color:#fff; padding:8px 22px 7px; }
  .band .inner { display:flex; align-items:center; gap:14px; max-width:1900px; margin:0 auto; flex-wrap:wrap; min-height:30px; }
  .band h1 { font-size:17px; font-weight:800; display:flex; align-items:center; gap:9px; }
  .band h1 small { font-size:12.5px; opacity:.75; font-weight:500; }
  .band h1 img.mark { width:22px; height:22px; border-radius:5px; background:#fff; }
  .views { display:inline-flex; gap:2px; background:rgba(255,255,255,.12); border-radius:8px; padding:2px; }
  .views a { color:#fff; text-decoration:none; font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:6px; opacity:.85; }
  .views a.on { background:#fff; color:var(--navy); opacity:1; }
  .band .right { margin-left:auto; font-size:12px; opacity:.9; }
  .band .right a { color:#fff; }
  .wrap { max-width:1900px; margin:0 auto; padding:18px 22px; display:flex; flex-direction:column; gap:16px; }
  .head { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .seg { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
  .seg button { border:none; background:none; border-radius:7px; min-height:36px; padding:0 12px; font-weight:700; color:var(--navy); cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; }
  .pill { border:1.5px solid var(--navy); background:#fff; color:var(--navy); border-radius:999px; min-height:36px; padding:0 13px; font-weight:700; cursor:pointer; }
  .pill.on { background:var(--navy); color:#fff; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); }
  .quietbtn { background:#e5e9ee; border:none; border-radius:8px; min-height:36px; padding:0 12px; font-weight:700; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(150px,100%),1fr)); gap:10px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .tile.lead { background:var(--navy); color:#fff; border-color:var(--navy); }
  .tile.lead .lbl, .tile.lead .sm { color:#dbe4ef; }
  .tile .big { font-size:26px; font-weight:800; line-height:1.15; }
  .tile .big small { font-size:13px; font-weight:600; opacity:.75; }
  .tile .sm { font-size:12px; color:var(--steel); }
  .bar { display:flex; height:26px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .bar div { display:flex; align-items:center; padding:0 9px; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; }
  .maphead { display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); }
  .scroller { overflow:auto; padding:12px; }
  .host { position:relative; }
  .host svg.edges { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .bandbg { position:absolute; background:#e6ebf1; border:1px solid #c9d2dd; border-radius:10px; }
  .bandlbl { position:absolute; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--steel); text-transform:uppercase; }
  .bandnote { position:absolute; font-size:11.5px; color:var(--steel); text-align:right; }
  .node { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; cursor:pointer; line-height:16px; font-size:13px;
          border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:4px; user-select:none; }
  .node b { display:block; }
  .node .s { display:block; font-size:11.5px; opacity:.9; }
  .node.control { border-radius:8px; }
  /* a supplier, a customer and an outside shop wear the VSM factory roof */
  .node.supplier, .node.customer, .node.outside { border-radius:0; overflow:visible; }
  .node.supplier::before, .node.customer::before, .node.outside::before { content:""; position:absolute; left:-2px; top:-15px; width:58%; height:14px; background:var(--ink);
    clip-path:polygon(0 100%, 0 0, 33% 100%, 33% 0, 66% 100%, 66% 0, 100% 100%); }
  .node.sel { box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--amber); z-index:3; }
  .sys .node.r-anetix { background:var(--anetix); color:#fff; border-color:var(--anetix); }
  .sys .node.r-next { background:var(--next); color:var(--navy); border:2px dashed var(--navy); }
  .sys .node.r-other { background:var(--other); color:#14202c; }
  .sys .node.r-paper { background:var(--paper); color:#3d2000; }
  .sys .node.r-none { background:repeating-linear-gradient(135deg,#fff 0 6px,#e3e7ec 6px 12px); border:2px dashed #6b7785; }
  .arrange .node { cursor:grab; }
  .arrange .node:active { cursor:grabbing; }
  .databox { position:absolute; border:1px solid var(--ink); background:#fff; font-size:11.5px; line-height:16px; padding:6px 8px; }
  .databox b { font-weight:700; }
  .databox .unk { color:var(--steel); }
  .elabel { position:absolute; font-size:12px; line-height:15px; color:var(--steel); text-align:center; pointer-events:none; }
  .elabel.word { color:#7a3a00; } .elabel.sys { color:var(--navy); }
  .tri { position:absolute; width:30px; height:26px; background:var(--gold); clip-path:polygon(50% 0,100% 100%,0 100%); display:flex; align-items:flex-end; justify-content:center; font-size:12px; font-weight:800; pointer-events:none; }
  .trilbl { position:absolute; font-size:12px; color:var(--steel); text-align:center; width:56px; pointer-events:none; }
  .kz { position:absolute; width:34px; height:34px; background:var(--amber); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; z-index:4; cursor:pointer;
        clip-path:polygon(50% 0%,61% 18%,80% 9%,79% 30%,100% 33%,86% 50%,100% 67%,79% 70%,80% 91%,61% 82%,50% 100%,39% 82%,20% 91%,21% 70%,0% 67%,14% 50%,0% 33%,21% 30%,20% 9%,39% 18%); border:none; }
  .agent { position:absolute; height:24px; border:1.5px dotted var(--navy); border-radius:999px; background:#fff; color:var(--navy); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:5px; white-space:nowrap; overflow:hidden; text-decoration:none; }
  /* the agent board (src/vsm-agents.js): a chip is a link to the agent's channel; a set-up agent is solid, a flag shows its count */
  .agent.on { border-style:solid; }
  .agent.paused { opacity:.6; }
  .agent .fl { background:var(--amber); color:#fff; border-radius:999px; padding:0 6px; font-size:10.5px; }
  .agent .fl.up { background:var(--red); }
  .node.alarm { box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--red); }
  .live { color:var(--navy); font-weight:600; }
  .ladder { position:absolute; display:flex; font-size:11.5px; color:var(--steel); }
  .ladder .w { border-top:2px solid var(--ink); text-align:center; padding-top:4px; flex:none; }
  .ladder .p { border:2px solid var(--ink); border-top:none; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; flex:none; }
  .lower { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .detail { flex:2 1 600px; min-width:0; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .side { flex:1 1 380px; min-width:0; display:flex; flex-direction:column; gap:16px; }
  .side .card { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:#eef0f3; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(250px,100%),1fr)); gap:12px 22px; }
  .quote { background:var(--fog); border-radius:8px; padding:12px 14px; }
  .quote blockquote { font-style:italic; font-size:14px; }
  .quote figcaption { font-size:12px; color:var(--steel); margin-top:4px; }
  .tools a { font-weight:700; }
  .q { border-top:1px solid #e3e7ec; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
  .q:first-of-type { border-top:none; padding-top:0; }
  .q .claim { font-weight:700; }
  .q .why { color:var(--steel); }
  .q .acts { display:flex; flex-wrap:wrap; gap:8px; }
  .ok { border:1.5px solid var(--green); background:#fff; color:#1d5535; border-radius:8px; min-height:38px; padding:0 12px; font-weight:700; cursor:pointer; }
  .fix { border:1.5px solid var(--amberDeep); background:#fff; color:#7a3a00; border-radius:8px; min-height:38px; padding:0 12px; font-weight:700; cursor:pointer; }
  .go { background:var(--navy); color:#fff; border:none; border-radius:8px; min-height:38px; padding:0 14px; font-weight:700; cursor:pointer; }
  textarea, input[type=text], select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; background:#fff; }
  textarea { min-height:60px; resize:vertical; }
  .st-confirmed { color:#1d5535; font-weight:700; } .st-fix { color:#7a3a00; font-weight:700; } .st-open { color:var(--steel); font-weight:700; }
  .form { display:flex; flex-direction:column; gap:10px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-weight:600; }
  .row2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(200px,100%),1fr)); gap:10px; }
  .dr { display:grid; grid-template-columns:1fr 2fr auto; gap:6px; align-items:center; }
  .x { border:none; background:none; color:var(--red); font-weight:800; font-size:16px; cursor:pointer; min-width:32px; min-height:32px; }
  .legend div { display:flex; align-items:center; gap:10px; }
  .legend .sw { width:28px; height:16px; border-radius:3px; flex:none; }
  table.stages { width:100%; border-collapse:collapse; min-width:900px; }
  table.stages th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); padding:10px; border-bottom:1px solid var(--line); }
  table.stages td { padding:9px 10px; border-bottom:1px solid #e9ecf0; vertical-align:top; }
  details.stagesbox > summary { cursor:pointer; padding:14px 16px; font-weight:700; font-size:15px; list-style-position:inside; }
  .note { color:var(--steel); font-size:12px; }
  .empty { padding:28px; text-align:center; color:var(--steel); }
  .err { background:#fbe3e1; color:#7d1a14; border-radius:8px; padding:10px 12px; }
  .feed .m { border-top:1px solid #e3e7ec; padding-top:8px; display:flex; flex-direction:column; gap:3px; }
  .feed .m:first-of-type { border-top:none; padding-top:0; }
  .feed .who { font-size:12px; font-weight:700; color:var(--navy); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; }
  /* the mapping walk (src/vsm-walk.js): one screen at a time, built for a phone or a tablet on the floor */
  .walk { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .wmain { flex:2 1 560px; min-width:0; padding:18px 20px 22px; display:flex; flex-direction:column; gap:14px; }
  .wmain h2 { font-size:21px; line-height:1.25; }
  .wmain p { max-width:70ch; }
  .steps { display:flex; flex-wrap:wrap; gap:4px; }
  .steps span { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:#eef0f3; color:var(--steel); }
  .steps span.done { background:var(--greenSoft); color:#1d5535; }
  .steps span.now { background:var(--navy); color:#fff; }
  .go.big, .ok.big, .fix.big, .quietbtn.big { min-height:46px; padding:0 18px; font-size:14px; }
  .go[disabled] { opacity:.45; cursor:not-allowed; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(240px,100%),1fr)); gap:10px; }
  .opt { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:3px; cursor:pointer; min-height:64px; }
  .opt:hover, .opt:focus-visible { border-color:var(--navy); }
  .opt b { font-size:15px; }
  .guess { border:2px solid var(--navy); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; background:#f7f9fc; }
  .guess .gname { font-size:19px; }
  .inline { display:flex; gap:8px; flex-wrap:wrap; }
  .inline input { flex:1 1 220px; width:auto; }
  fieldset.box { border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  fieldset.box legend { padding:0 4px; }
  .tog { display:inline-flex !important; flex-direction:row !important; align-items:center; gap:7px; font-weight:600; background:#eef0f3; border-radius:999px; padding:6px 12px; cursor:pointer; min-height:36px; }
  .tog:has(input:checked) { background:var(--navy); color:#fff; }
  .tog:has(input:checked) .note { color:#dbe4ef; }
  .tog input { accent-color:var(--navy); }
  .srcs { display:flex; flex-direction:column; gap:6px; }
  .src { display:flex; align-items:center; gap:10px; background:var(--fog); border-radius:8px; padding:6px 6px 6px 12px; }
  .src b { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .crow { display:grid; grid-template-columns:minmax(120px,1.4fr) minmax(90px,1fr) minmax(110px,1fr) minmax(100px,1fr) minmax(120px,1fr) minmax(110px,1fr) auto; gap:6px; align-items:center; }
  @media (max-width:900px) { .crow { grid-template-columns:1fr 1fr; border-top:1px solid #e3e7ec; padding-top:8px; } }
  ol.flow { padding-left:22px; display:flex; flex-direction:column; gap:6px; }
  .linkish { background:none; border:none; padding:0; color:var(--navy); font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:2px; text-align:left; }
  .spin { width:28px; height:28px; border:3px solid #dbe4ef; border-top-color:var(--navy); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .walkchip { background:#fbe3cc; color:#7a3a00; }
  @media (max-width:700px) { .wrap { padding:12px; } .band { padding:8px 12px; } .band .right { margin-left:0; } .wmain { padding:14px; } }
  /* M3: a burst's card and actions, the requests on a box, the future state */
  .kz.done { background:var(--green); }
  .burst { display:flex; gap:10px; align-items:flex-start; padding:8px 0 2px; border-top:1px solid var(--fog); }
  .burst:first-of-type { border-top:none; }
  .burst .ev { font-size:12.5px; color:var(--steel); margin-top:3px; }
  .acts2 { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .acts2 button, .acts2 a { min-height:32px; padding:0 10px; font-size:12.5px; }
  .stw { font-weight:700; font-size:12px; color:var(--steel); }
  .stw.done { color:#1d5535; } .stw.in_progress { color:var(--navy); } .stw.declined { color:#7d1a14; }
  .cards { display:flex; flex-direction:column; gap:4px; }
  .cards a { color:var(--ink); text-decoration:none; } .cards a:hover b { text-decoration:underline; }
  .futurebar { padding:12px 16px; display:flex; flex-direction:column; gap:8px; border-color:#9fc0a8; background:#f2f8f3; }
  .askbox { border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--fog); }
  .askbox textarea { min-height:64px; }
  .tog { display:inline-flex; align-items:center; gap:6px; font-weight:600; }
</style>
</head>
<body>
<div class="band"><div class="inner">
  <h1><img class="mark" id="comark" alt="">Value stream map <small id="coname"></small></h1>
  <nav class="views" aria-label="Views"><a href="./">Kaizen</a><a class="on" href="map" aria-current="page">Map</a><a href="agent-board">Agents</a></nav>
  <span class="right" id="who"></span>
</div></div>
<main class="wrap" id="app"><div class="empty">Loading the map…</div></main>
<script>
const SLUG = (location.pathname.split("/")[2] || "").toLowerCase();
const API = `/api/c/${SLUG}/vsm`;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REC = { anetix: "In Anetix", next: "Anetix, rolling out", other: "Another system", paper: "Paper, email or word of mouth", none: "No record" };
const CONF = { heard: ["Heard on a walk-through", "#e3efe7", "#1d5535"], seen: ["Seen in a tool or document", "#dfe7f1", "#1f3a5f"], assumed: ["Assumed, needs a person to confirm", "#fbe3cc", "#7a3a00"], confirmed: ["Confirmed", "#e3efe7", "#1d5535"] };
const EDGE = { push: ["#1c242e", 3, ""], pull: ["#1c242e", 3, "2 5"], fifo: ["#1c242e", 3, ""], supermarket: ["#1c242e", 3, ""], supply: ["#1c242e", 3, ""], ship: ["#1c242e", 3, ""], info_system: ["#1f3a5f", 2, ""], info_word: ["#c2620a", 2, "6 5"] };
const S = { ov: null, mapId: null, view: null, sel: null, layers: { sys: true, agents: false, kz: true, ladder: true }, arrange: false, editing: false, fixing: null, err: "", fit: true, z: 1,
            panel: null, walk: null, walkEdit: null,     // panel "walk": the mapping walk is open instead of the map
            asking: false };                              // M3: the box's "Ask for something here" form is open

async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({ cache: "no-store", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (r.status === 401 || r.status === 403) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; throw new Error("sign in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "That did not work. Try again.");
  return j;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });

async function load(keepSel) {
  S.ov = await api("");
  const co = S.ov.company || {};
  document.getElementById("coname").textContent = co.name || "";
  document.title = `${co.name || "Map"} · Value stream map`;
  const mark = document.getElementById("comark"); mark.src = `/api/c/${SLUG}/icon`; mark.onerror = () => { mark.style.display = "none"; };
  document.getElementById("who").innerHTML = `signed in as <b>${esc(S.ov.role)}</b>${S.ov.role === "admin" ? ' · <a href="/admin">admin</a>' : ""} · <a href="/c/${esc(SLUG)}/settings">Settings</a> · <a href="/logout">sign out</a>`;
  const wantWalk = Number(new URLSearchParams(location.search).get("walk"));
  if (wantWalk && !S.panel && !keepSel) { try { return await openWalk(wantWalk); } catch (e) { history.replaceState(null, "", location.pathname); } }
  if (!S.ov.maps.length) { S.view = null; return render(); }
  // the board's "Show on map" names a map by its key and a box by its (M3)
  const qs = new URLSearchParams(location.search), byKey = qs.get("mapkey") && S.ov.maps.find((m) => m.key === qs.get("mapkey"));
  const want = (byKey && !S.mapId ? byKey.id : null) || Number(qs.get("map")) || S.mapId;
  S.mapId = S.ov.maps.some((m) => m.id === want) ? want : (S.ov.maps.find((m) => m.state !== "future") || S.ov.maps[0]).id;
  S.view = await api(`/maps/${S.mapId}`);
  if (byKey && qs.get("box") && !keepSel && S.view.nodes.some((n) => n.key === qs.get("box"))) { S.sel = qs.get("box"); keepSel = true; history.replaceState(null, "", `?map=${S.mapId}`); }
  watchDraft();
  // the Agents layer opens on its own the first time once an agent on this company's map is running
  if (!S.layersAuto) { S.layersAuto = true; if ((((S.view.agents || {}).agents) || []).some((a) => a.status === "on")) S.layers.agents = true; }
  if (!keepSel || !S.view.nodes.some((n) => n.key === S.sel)) S.sel = (S.view.nodes.find((n) => n.kind === "control") || S.view.nodes[0] || {}).key || null;
  render({ keep: Boolean(keepSel) });
}

// ---------- coverage
function coverageHtml() {
  const c = S.ov.coverage, t = c.total || 0;
  if (!t) return "";
  const pct = (n) => (t ? Math.round((n / t) * 100) : 0);

// ---------- geometry
const byKey = () => Object.fromEntries(S.view.nodes.map((n) => [n.key, n]));
function port(n, side, at) {
  if (side === "left") return [n.x, n.y + n.h * at];
  if (side === "right") return [n.x + n.w, n.y + n.h * at];
  if (side === "top") return [n.x + n.w * at, n.y];
  return [n.x + n.w * at, n.y + n.h];
}
const horiz = (s) => s === "left" || s === "right";
function route(e, nodes) {
  const a = nodes[e.from_key], b = nodes[e.to_key];
  if (!a || !b) return null;
  const p = port(a, e.from_side, e.from_at), r = port(b, e.to_side, e.to_at);
  if (horiz(e.from_side) && horiz(e.to_side)) { if (Math.abs(p[1] - r[1]) < 1) return [p, r]; const m = Math.round((p[0] + r[0]) / 2); return [p, [m, p[1]], [m, r[1]], r]; }
  if (!horiz(e.from_side) && !horiz(e.to_side)) { if (Math.abs(p[0] - r[0]) < 1) return [p, r]; const m = Math.round((p[1] + r[1]) / 2); return [p, [p[0], m], [r[0], m], r]; }
  if (horiz(e.from_side)) return [p, [r[0], p[1]], r];
  return [p, [p[0], r[1]], r];
}
// a box's live numbers from the tools' stage events (src/vsm-stages.js), when it is tied to a step
const liveOf = (n) => (S.view && S.view.live && S.view.live.nodes ? S.view.live.nodes[n.key] || null : null);
const mins = (m) => (m == null ? "?" : m < 1 ? "under 1 min" : m < 90 ? `${m} min` : m < 2880 ? `${Math.round(m / 6) / 10} h` : `${Math.round(m / 144) / 10} d`);
const liveRows = (lv) => (lv ? [`<b>Live</b> <span class="live">C/T ${esc(mins(lv.cycle_min))} · WIP ${lv.wip}</span>`, `<span class="live">${lv.fpy == null ? "" : `FPY ${lv.fpy}% · `}${lv.per_day} a day</span>`] : []);
const dataH = (n) => (n.kind === "process" ? Math.max(40, 14 + 16 * (2 + (n.data || []).length + (n.who ? 1 : 0) + liveRows(liveOf(n)).length)) : 0);

function mapHtml() {
  const v = S.view, nodes = byKey(), L = v.map.layout || {};
  let W = 0, H = 0;
  for (const n of v.nodes) { W = Math.max(W, n.x + n.w + 40); H = Math.max(H, n.y + n.h + (dataH(n) ? dataH(n) + 8 : 0) + 40); }
  for (const b of L.bands || []) { W = Math.max(W, b.x + b.w + 24); H = Math.max(H, b.y + b.h + 24); }
  const procs = v.nodes.filter((n) => n.kind === "process").sort((a, b) => a.x - b.x);
  const ladderY = L.ladder_y != null ? L.ladder_y : (procs.length ? Math.max(...procs.map((n) => n.y + n.h + dataH(n) + 48)) : 0);
  if (S.layers.ladder && procs.length) H = Math.max(H, ladderY + 80);
  if (S.layers.agents) H += 0;
  // the bands are drawn first, under the flows, so a flow between two production control boxes shows on the band
  let svg = "", html = "", under = "";
  const climbed = new Set(((v.agents || {}).climbed_boxes) || []);
  for (const b of L.bands || []) under += `<div class="bandbg" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"></div><div class="bandlbl" style="left:${b.x + 16}px;top:${b.y + 8}px">${esc(b.label)}</div><div class="bandnote" style="left:${b.x + 240}px;width:${Math.max(80, b.w - 256)}px;top:${b.y + 8}px">${esc(b.note || "")}</div>`;
  const defs = Object.entries({ k: "#1c242e", n: "#1f3a5f", o: "#c2620a" }).map(([id, c]) => `<marker id="h-${id}" orient="auto" markerWidth="5" markerHeight="5" refX="3" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="${c}"/></marker>`).join("");
  for (const e of v.edges) {
    const pts = route(e, nodes); if (!pts) continue;
    const [color, width, dash] = EDGE[e.kind] || EDGE.push;
    const m = color === "#1f3a5f" ? "n" : color === "#c2620a" ? "o" : "k";
    // stop short of the box so the head sits on its edge

    const dx = Math.sign(last[0] - prev[0]), dy = Math.sign(last[1] - prev[1]), back = width * 2;

    const cls = e.kind === "info_word" ? "word" : e.kind === "info_system" ? "sys" : "";
    if (e.label) {

      const clear = (r) => !boxes.some((b) => r[0] < b[2] && r[2] > b[0] && r[1] < b[3] && r[3] > b[1]);
      if (seg[0][1] === seg[1][1]) {
        const mx = (seg[0][0] + seg[1][0]) / 2, w = Math.min(170, Math.max(70, best - 16)), y = seg[0][1];
        const above = [mx - w / 2, y - 36, mx + w / 2, y - 4];
        const top = clear(above) ? y - 36 : y + 6;
        html += `<div class="elabel ${cls}" style="left:${mx - w / 2}px;top:${top}px;width:${w}px;height:32px;display:flex;align-items:${top < y ? "flex-end" : "flex-start"};justify-content:center">${esc(e.label)}</div>`;
      } else {
        const my = (seg[0][1] + seg[1][1]) / 2, x = seg[0][0], w = 150;
        const left = [x - 10 - w, my - 15, x - 10, my + 15];

        html += `<div class="elabel ${cls}" style="left:${onLeft ? x - 10 - w : x + 10}px;top:${my - 15}px;width:${w}px;height:30px;display:flex;align-items:center;justify-content:${onLeft ? "flex-end" : "flex-start"};text-align:${onLeft ? "right" : "left"}">${esc(e.label)}</div>`;

    }

  for (const n of v.nodes) {

    html += `<button type="button" class="${cls}" data-node="${esc(n.key)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" aria-label="${esc(n.label)}${n.sub ? ", " + esc(n.sub) : ""}: ${esc(REC[n.record_kind])}"><span><b>${esc(n.label)}</b>${n.sub ? `<span class="s">${esc(n.sub)}</span>` : ""}</span></button>`;
    if (n.kind === "process") {

      html += `<div class="databox" data-node="${esc(n.key)}" style="left:${n.x}px;top:${n.y + n.h + 8}px;width:${n.w}px;min-height:${dataH(n)}px">${rows.join("<br>")}</div>`;
    }
    if (S.layers.agents && n.detail && n.detail.agent_name && v.map.state !== "future") {   // no agent watches a future state
      const factory = ["supplier", "customer", "outside"].includes(n.kind);
      const top = n.kind === "process" ? n.y + n.h + 8 + dataH(n) + 8 : n.y - (factory ? 46 : 30);
      const ag = agentOf(n.detail.agent_name);

      const fl = ag && ag.open ? `<span class="fl ${ag.climbed ? "up" : ""}" title="open flags">${ag.open}</span>` : "";
      html += `<a class="agent ${esc(cls)}" data-for="${esc(n.key)}" href="agent-board?channel=${encodeURIComponent(ag && ag.status !== "not_set_up" ? `a:${ag.key}` : "plant")}" title="${esc(ag && ag.status === "not_set_up" ? "Not set up yet: open the agent board to set it up" : "Open this agent's channel")}" style="left:${n.x}px;top:${top}px;width:${n.kind === "process" ? n.w : n.w - 24}px">${esc(n.detail.agent_name)}${fl}</a>`;
    }
  }
  if (S.layers.kz) for (const z of v.kaizen) { const n = nodes[z.node_key]; if (n && z.status !== "dismissed") html += `<button type="button" class="kz ${z.status === "filed" ? "done" : ""}" data-node="${esc(n.key)}" style="left:${n.x + n.w - 18}px;top:${n.y - 18}px" title="${esc(z.title)}${z.status === "filed" ? ` (request #${z.feedback_id})` : ""}" aria-label="Kaizen ${z.n}: ${esc(z.title)}">${z.n}</button>`; }

}

// The data boxes wrap their words, so their heights are only known once drawn: the agent chips and the ladder move

function layoutAfter() {
  const host = document.getElementById("host"); if (!host) return;

  let bottom = 0;
  host.querySelectorAll(".databox").forEach((d) => {
    const b = d.offsetTop + d.offsetHeight; bottom = Math.max(bottom, b);
    const chip = host.querySelector(`.agent[data-for="${d.dataset.node}"]`);

  const h = Math.max(parseInt(host.style.height, 10) || 0, bottom + 24);
  host.style.height = `${h}px`;
  const svg = host.querySelector("svg.edges"); const w = parseInt(host.style.width, 10) || 0;

let draftT = null;
// while the agent drafts, the page looks every few seconds, and opens the draft when it is there (at once, when it was
// quicker than the page). S.awaitFuture: the future state that was there before "Draft", so a new one is told apart.
function watchDraft() {
  clearTimeout(draftT);
  const f = S.view && S.view.future;
  if (!f || S.view.map.state === "future") return;
  const had = S.awaitFuture !== undefined ? S.awaitFuture : (f.future ? f.future.id : null);
  const fresh = (x) => x && !x.drafting && x.future && x.future.id !== had;
  if (S.awaitFuture !== undefined && fresh(f) && !typing()) { delete S.awaitFuture; openMap(f.future.id); return; }
  if (!f.drafting) { delete S.awaitFuture; return; }
  const from = S.view.map.id;
  draftT = setTimeout(async () => {
    try {
      const v = await api(`/maps/${from}`);
      if (S.view && S.view.map.id === from) {
        // the draft is there: open it, unless someone is typing; then the Future state tab shows it is ready
        if (fresh(v.future) && !typing()) { delete S.awaitFuture; S.ov = await api(""); return openMap(v.future.future.id); }
        if (fresh(v.future)) { delete S.awaitFuture; S.ov = await api(""); S.view.future = v.future; return render({ keep: true }); }
        S.view.future = v.future; S.awaitFuture = had; render({ keep: true });
      }
    } catch (e) { /* the next look tries again */ }
    watchDraft();
  }, 3000);
}

// ---------- the mapping walk (src/vsm-walk.js, docs/VSM.md section 5): one screen at a time; every answer is saved as it

// The screen on show: the walk's own, or one of its earlier answers opened again to change it
function screenNow() {
  const w = S.walk, e = S.walkEdit, st = w.settled || {};
  if (!e) return w.screen;
  if (e.kind === "card") {
    const i = w.walked.findIndex((x) => x.key === e.key); if (i < 0) return w.screen;
    const s = w.walked[i];
    return { kind: "card", key: s.key, position: w.walked.length - i, step: s, evidence: s.quote ? { quote: s.quote, quote_by: s.quote_by } : null, control: (st.control || []).map((c) => ({ key: c.key, name: c.name })), systems: st.systems || [], edit: true };
  }
  if (e.kind === "family") return { kind: "family", options: w.family_options || [], edit: true };
  if (e.kind === "customer") return { kind: "customer", prefill: st.customer || {}, edit: true };
  if (e.kind === "systems") return { kind: "systems", suggested: (w.found || {}).systems || [], chosen: st.systems || [], edit: true };
  if (e.kind === "supplier") return { kind: "supplier", prefill: st.supplier || {}, first: (w.walked[0] || {}).name || "the first step", edit: true };
  if (e.kind === "control") return { kind: "control", prefill: st.control || [], edit: true };
  return w.screen;

  if (act === "w-cancel") { S.walkEdit = null; S.err = ""; return render(); }
  if (act === "w-card") { S.walkEdit = { kind: "card", key: t.dataset.key }; S.err = ""; render(); return scrollTo(0, 0); }
  if (act === "w-edit") { S.walkEdit = { kind: t.dataset.kind }; S.err = ""; render(); return scrollTo(0, 0); }
  if (act === "w-rmsrc") { await wpost(`/sources/${t.dataset.src}/remove`, {}); return render(); }
  if (act === "w-read") { t.disabled = true; await wpost("/read", {}); render(); return poll(); }
  if (act === "w-family") { await wpost("/answer", { screen: "family", family: t.dataset.key }); return render(); }
  if (act === "w-pick") { const sc = screenNow(); await wpost("/answer", { screen: sc.kind, pick: t.dataset.pick }); render(); return scrollTo(0, 0); }
  if (act === "w-remove") { if (!confirm("Take this step off the walk?")) return; await wpost("/answer", { screen: "remove", key: t.dataset.key }); return render(); }
  if (act === "w-more" || act === "w-moreup") { await wpost("/answer", { screen: "more" }); return render(); }
  if (act === "w-addctl") { document.getElementById("crows").insertAdjacentHTML("beforeend", ctlRow({})); return; }
  if (act === "w-dropctl") { t.closest(".crow").remove(); return; }
  if (act === "w-draft") { t.disabled = true; await wpost("/draft", {}); return render(); }
  if (act === "w-reopen") { await wpost("/reopen", {}); return render(); }
  if (act === "w-reread") { if (!confirm("Read the sources again? The walk starts over from its sources; the sources stay, the answers go.")) return; await wpost("/reread", {}); return render(); }
  if (act === "w-abandon") { if (!confirm("Put this walk away? Its draft map goes with it; the map in use stays as it is. For two weeks the Map page can bring the walk back, with its sources and answers.")) return; await wpost("/abandon", {}); return closeWalk(); }
  if (act === "w-back") { await wpost("/bring-back", {}); return render(); }
  if (act === "w-another") { const r = await post("/walks", { from_walk: S.walk.id }); return openWalk(r.walk.id); }
  if (act === "w-showmap") { const id = Number(t.dataset.mapid); clearTimeout(pollT); S.panel = null; S.walk = null; S.mapId = id; history.replaceState(null, "", `?map=${id}`); return load(false); }
}
async function walkFile(file) {
  if (file.size > 15 * 1024 * 1024) throw new Error("That file is bigger than 15 MB.");
  const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(new Error("That file could not be read.")); fr.readAsDataURL(file); });
  await wpost("/file", { filename: file.name, mime: file.type, data });
}

// A redraw from the page's own looking (a review answer, a burst filed, the future draft's poll) keeps the forms a
// person is typing in as they are, with the cursor where it was (the VSM audit, 2026-11-03: the 3-second poll wiped
// them). A redraw a form asked for itself (a save that failed, with its error) draws it fresh.
function snapForms() {
  const out = [];
  const ctxOf = (id) => (id === "fixtext" ? S.fixing : id === "kzform" ? S.kzfile && S.kzfile.z : S.sel);
  for (const id of ["editform", "askform", "fixtext", "kzform"]) { const el = document.getElementById(id); if (el) out.push({ id, el, ctx: ctxOf(id) }); }
  const a = document.activeElement;
  return { out, active: a && a !== document.body ? a : null, start: a && a.selectionStart, end: a && a.selectionEnd };
}
function putForms(k) {
  for (const x of k.out) {
    const now = document.getElementById(x.id);
    const same = x.id === "fixtext" ? S.fixing === x.ctx : x.id === "kzform" ? Boolean(S.kzfile) && S.kzfile.z === x.ctx : S.sel === x.ctx;
    if (now && now !== x.el && same) now.replaceWith(x.el);
  }
  if (k.active && document.contains(k.active) && document.activeElement !== k.active) { k.active.focus({ preventScroll: true }); try { k.active.setSelectionRange(k.start, k.end); } catch (e) { /* not a text box */ } }
}
const typing = () => S.editing || S.asking || S.fixing != null || Boolean(S.kzfile) || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
function render(opts = {}) {
  const kept = opts.keep ? snapForms() : null;
  const app = document.getElementById("app");
  if (!S.ov) return;
  if (S.panel === "walk" && S.walk) { app.innerHTML = walkHtml(); return; }
  const imp = S.ov.can_import ? `<label class="quietbtn" style="cursor:pointer">Import a map<input type="file" accept="application/json,.json" id="importfile" hidden></label>` : "";
  const walks = (S.ov.walks || []).slice(0, 3).map((w) => `<button type="button" class="pill" data-act="w-open" data-walk="${w.id}">Walk: ${esc(w.family || (w.status === "reading" ? "reading" : "sources"))}${w.steps ? ` · ${w.steps} steps` : ""}</button>`).join("");
  const away = (S.ov.walks_away || []).map((w) => `<button type="button" class="quietbtn" data-act="w-open" data-walk="${w.id}">Put away: ${esc(w.family || "a walk")}</button>`).join("");
  const walkBtns = `${walks}<button type="button" class="quietbtn" data-act="w-new">Map a family</button>${away}`;
  if (!S.view) {
    app.innerHTML = `<div class="card empty"><h2 style="font-size:18px;color:var(--ink);margin-bottom:6px">No value stream map yet</h2><p>The map shows every step of the plant, the information and material between them, and where each step's record lives. The mapping walk builds it with you: add your call and walk-through notes, the agent makes a first guess at every step, and you confirm each one walking upstream from shipping.</p><div class="chips" style="justify-content:center;margin-top:12px">${walks}<button type="button" class="go big" data-act="w-new">Start the mapping walk</button>${imp}</div>${S.err ? `<div class="err" style="margin-top:10px">${esc(S.err)}</div>` : ""}</div>`;
    return;
  }
  const cur = S.view.map.state === "future" ? S.ov.maps.find((m) => m.key === S.view.map.parent_key) : S.view.map;
  const fam = S.ov.maps.filter((m) => m.state !== "future").map((m) => `<button type="button" data-map="${m.id}" class="${cur && m.id === cur.id ? "on" : ""}" aria-pressed="${Boolean(cur && m.id === cur.id)}">${esc(m.family)}${m.proposed ? " · walk draft" : ""}</button>`).join("");
  // current or future state (M3): the future is the agent's draft until a manager keeps it
  const fut = S.view.map.state === "future" ? S.view.map : S.ov.maps.find((m) => m.state === "future" && cur && m.parent_key === cur.key);
  const fs = S.view.future || {};
  const stateSeg = S.view.map.proposed ? "" : [
    fut ? `<div class="seg" role="group" aria-label="Current or future state"><button type="button" data-map="${cur ? cur.id : S.mapId}" class="${S.view.map.state !== "future" ? "on" : ""}">Current state</button><button type="button" data-map="${fut.id}" class="${S.view.map.state === "future" ? "on" : ""}">Future state</button></div>` : "",
    fs.drafting ? `<span class="note" role="status"><span class="spin" style="display:inline-block;width:14px;height:14px;margin:0 6px -2px 0;border-width:2px"></span>The agent is drafting the future state…</span>`
      : fut ? "" : `<button type="button" class="pill" data-act="fs-draft" data-from="${S.mapId}">Draft the future state</button>`,
    fs.error && !fs.drafting ? `<span class="err" style="padding:4px 8px">${esc(fs.error)}</span>` : ""].join("");
  const layer = (k, label) => `<button type="button" class="pill ${S.layers[k] ? "on" : ""}" data-layer="${k}" aria-pressed="${S.layers[k]}">${label}</button>`;
  const scroll = document.querySelector(".scroller"); const keep = scroll ? [scroll.scrollLeft, scroll.scrollTop] : null;
  app.innerHTML = `<div class="head"><div class="controls"><div class="seg" role="group" aria-label="Product family">${fam}</div>
      <div class="controls" role="group" aria-label="Layers"><span class="lbl">Layers</span>${layer("sys", "Systems")}${layer("agents", "Agents")}${layer("kz", "Kaizen")}${layer("ladder", "Timeline")}</div></div>
    <div class="controls">${stateSeg}${walkBtns}<button type="button" class="pill ${S.arrange ? "on" : ""}" data-act="arrange" aria-pressed="${S.arrange}">${S.arrange ? "Done arranging" : "Arrange boxes"}</button><a class="quietbtn" href="${API}/export">Download the map</a>${imp}</div></div>
    ${coverageHtml()}
    ${S.notice ? `<div class="card" role="status" style="padding:12px 16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-color:#9fc0a8;background:#f2f8f3"><div>${esc(S.notice)}</div><button type="button" class="quietbtn" data-act="notice-x" aria-label="Close this note">Close</button></div>` : ""}
    ${futureBarHtml()}
    ${S.view.map.proposed ? `<div class="card" style="padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-color:#e5b98a;background:#fff8f1"><div><b>This is the walk's draft of ${esc(S.view.map.family)}.</b> <span class="note">It sits beside the current map so the two can be compared. Using it replaces the current map; the current one is kept, hidden, with its kaizen and review answers.</span></div><div class="chips"><button type="button" class="quietbtn" data-act="w-open" data-walk="${S.view.map.walk_id}">Back to the walk</button><button type="button" class="go" data-act="w-use" data-walk="${S.view.map.walk_id}">Use this map</button></div></div>` : ""}
    <section class="card" aria-label="Map"><div class="maphead"><div style="font-size:15px"><b>${esc(S.view.map.title)}</b> <span class="note">· ${S.view.map.state === "future" ? "future state" : "current state"} · ${S.view.map.proposed ? "walk draft" : S.view.map.status === "confirmed" ? (S.view.map.state === "future" ? "kept" : "confirmed") : "draft"}</span></div><div class="controls"><span class="note">${S.arrange ? "Drag a box to move it. Its flows follow." : "Information across the top, material left to right below. Click a box for detail."}</span><button type="button" class="quietbtn" data-act="fit">${S.fit ? "Actual size" : "Fit to screen"}</button></div></div><div class="scroller">${mapHtml()}</div></section>
    <div class="lower">${detailHtml()}<div class="side">${reviewHtml()}${kaizenHtml()}${legendHtml()}</div></div>
    ${stagesHtml()}`;
  layoutAfter();
  if (keep) { const s2 = document.querySelector(".scroller"); s2.scrollLeft = keep[0]; s2.scrollTop = keep[1]; }
  if (kept) putForms(kept);
}
addEventListener("resize", () => { if (S.view && !drag) layoutAfter(); });

// ---------- events (delegated: no free text ever goes into an inline handler)
const app = document.getElementById("app");
let drag = null, suppressClick = false;
app.addEventListener("click", async (ev) => {
  if (suppressClick) { suppressClick = false; return; }
  const t = ev.target.closest("[data-map],[data-layer],[data-node],[data-act]");
  if (!t) return;
  try {
    if (t.dataset.map) { const keepBox = S.sel; S.mapId = Number(t.dataset.map); S.editing = false; S.asking = false; S.err = ""; history.replaceState(null, "", `?map=${S.mapId}`); S.view = await api(`/maps/${S.mapId}`); S.sel = S.view.nodes.some((n) => n.key === keepBox) ? keepBox : (S.view.nodes.find((n) => n.kind === "control") || S.view.nodes[0] || {}).key; render(); return watchDraft(); }
    if (t.dataset.layer) { S.layers[t.dataset.layer] = !S.layers[t.dataset.layer]; return render(); }
    if (t.dataset.node !== undefined && !t.dataset.act) { if (!t.dataset.node) return; S.sel = t.dataset.node; S.editing = false; S.asking = false; S.err = ""; render(); if (!t.closest(".host")) document.getElementById("host").scrollIntoView({ block: "nearest" }); return; }
    const act = t.dataset.act;
    if (act && act.startsWith("w-")) return await walkClick(t, act);
    if (act === "arrange") { S.arrange = !S.arrange; return render(); }
    if (act === "notice-x") { S.notice = ""; return render(); }
    // M3: a burst to a request, put away and back; a box's own request; the future state
    if (act === "kz-file") {
      S.kzfile = { z: Number(t.dataset.z), as: t.dataset.as, tool: t.dataset.tool || undefined, where: t.closest(".detail") ? "box" : "list" };
      S.err = ""; render(); const ta = document.getElementById("kzwords"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      return;
    }
    if (act === "kz-cancel") { S.kzfile = null; return render(); }
    if (act === "kz-away") { await post(`/kaizen/${t.dataset.z}/dismiss`, {}); S.err = ""; return load(true); }
    if (act === "kz-back") { await post(`/kaizen/${t.dataset.z}/restore`, {}); S.err = ""; return load(true); }
    if (act === "ask") { S.asking = true; S.err = ""; render(); const ta = document.getElementById("askwords"); if (ta) ta.focus(); return; }
    if (act === "ask-cancel") { S.asking = false; S.err = ""; return render(); }
    if (act === "fs-draft") {
      const from = Number(t.dataset.from);
      if (S.view.map.state === "future" && !confirm("Draft the future state again? This draft is kept, hidden; the requests its bursts became stay on the board.")) return;
      t.disabled = true;
      const had = S.view.map.state === "future" ? S.view.map.id : ((S.view.future || {}).future || {}).id || null;
      await post(`/maps/${from}/future`, {});
      S.mapId = from; S.awaitFuture = had; history.replaceState(null, "", `?map=${from}`); S.err = ""; return load(true);
    }
    if (act === "fs-keep") { await post(`/maps/${S.mapId}/keep`, {}); S.err = ""; return load(true); }
    if (act === "fit") { S.fit = !S.fit; return render(); }
    if (act === "edit") { S.editing = true; S.err = ""; render(); api("/steps").then((r) => { S.steps = r.steps || []; if (S.editing) render(); }).catch(() => {}); return; }
    if (act === "canceledit") { S.editing = false; S.err = ""; return render(); }
    if (act === "addrow") { document.getElementById("drows").insertAdjacentHTML("beforeend", `<div class="dr"><input type="text" name="dl" aria-label="Label"><input type="text" name="dv" value="?" aria-label="Value"><button type="button" class="x" data-act="droprow" aria-label="Remove this row">×</button></div>`); return; }
    if (act === "droprow") { t.closest(".dr").remove(); return; }
    if (act === "confirm") { await post(`/questions/${t.dataset.q}/answer`, { status: "confirmed" }); S.err = ""; return load(true); }
    if (act === "reopen") { await post(`/questions/${t.dataset.q}/answer`, { status: "open" }); S.err = ""; return load(true); }
    if (act === "startfix") { S.fixing = Number(t.dataset.q); S.err = ""; render(); const ta = document.getElementById("fixtext"); if (ta) ta.focus(); return; }
    if (act === "cancelfix") { S.fixing = null; S.err = ""; return render(); }
    if (act === "savefix") { await post(`/questions/${t.dataset.q}/answer`, { status: "fix", answer: document.getElementById("fixtext").value }); S.fixing = null; S.err = ""; return load(true); }
  } catch (e) {
    S.err = e.message;
    if (S.panel === "walk" && S.walk) { try { S.walk = (await api(`/walks/${S.walk.id}`)).walk; S.walkEdit = null; } catch (_) { /* keep what is shown */ } }
    render();
  }
});
app.addEventListener("submit", async (ev) => {
  if (ev.target.id === "wf") {
    ev.preventDefault();
    const f = ev.target, btn = f.querySelector("button[type=submit]");
    if (btn) btn.disabled = true;
    try {
      if (f.dataset.screen === "words") await wpost("/words", { title: f.elements.title.value, kind: f.elements.kind.value, words: f.elements.words.value });
      else await wpost("/answer", wformBody(f));
      render(); scrollTo(0, 0);
    } catch (e) { if (btn) btn.disabled = false; walkErr(e.message); }
    return;
  }
  if (ev.target.id === "kzform") {
    ev.preventDefault();
    const f = ev.target, k = S.kzfile;
    const btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
    try {
      const r = await post(`/kaizen/${k.z}/file`, { as: k.as, tool: k.tool, words: f.words.value });
      S.kzfile = null;
      if (r.intake_id) { location.href = `./?intake=${r.intake_id}`; return; }
      S.err = ""; await load(true);
    } catch (e) { k.err = e.message; k.typed = f.words.value; render(); const ta = document.getElementById("kzwords"); if (ta) ta.focus(); }
    return;
  }
  if (ev.target.id === "askform") {
    ev.preventDefault();
    const f = ev.target, n = S.view.nodes.find((x) => x.key === S.sel), pick = (f.querySelector("input[name=as]:checked") || {}).value || "plant";
    const [as, tool] = pick.split("|");
    const btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
    try {
      const r = await post(`/nodes/${n.id}/request`, { as, tool, words: f.words.value });
      if (r.intake_id) { location.href = `./?intake=${r.intake_id}`; return; }
      S.asking = false; S.err = ""; await load(true);
    } catch (e) { if (btn) btn.disabled = false; let box = f.querySelector(".err"); if (!box) { box = document.createElement("div"); box.className = "err"; box.setAttribute("role", "alert"); btn.parentElement.before(box); } box.textContent = e.message; }
    return;
  }
  if (ev.target.id !== "editform") return;
  ev.preventDefault();
  const f = ev.target, n = S.view.nodes.find((x) => x.key === S.sel);
  const body = { label: f.label.value, sub: f.sub.value, who: f.who.value, record_kind: f.record_kind.value, record_system: f.record_system.value, notes: f.notes.value, agent_name: f.agent_name.value,
    modules: [...f.querySelectorAll("input[name=mod]:checked")].map((i) => i.value) };
  if (f.querySelector("input[name=step]")) {
    const mine = Array.isArray((n.detail || {}).steps) ? n.detail.steps : [], seen = S.steps || [];
    const all = seen.map((x) => ({ module: x.module, step: x.step })).concat(mine.filter((m) => !seen.some((x) => x.module === m.module && x.step === m.step)));
    body.steps = [...f.querySelectorAll("input[name=step]:checked")].map((i) => all[Number(i.value)]).filter(Boolean);
  }
  if (n.kind === "process") { const ls = [...f.querySelectorAll("input[name=dl]")], vs = [...f.querySelectorAll("input[name=dv]")]; body.data = ls.map((l, i) => ({ label: l.value, value: vs[i].value })).filter((r) => r.label.trim()); }
  if (f.screen) { const [module, ...rest] = f.screen.value.split("|"); const cur = (n.detail || {}).screen; if (f.screen.value ? !(cur && cur.module === module && cur.route === rest.join("|")) : cur) body.screen = f.screen.value ? { module, route: rest.join("|") } : null; }
  try { await post(`/nodes/${n.id}`, body); S.editing = false; S.err = ""; await load(true); } catch (e) { S.err = e.message; render(); }
});
app.addEventListener("change", async (ev) => {
  if (ev.target.id === "wfile") {
    const file = ev.target.files[0]; if (!file) return;
    const lbl = ev.target.closest("label"); if (lbl) lbl.firstChild.textContent = "Adding the file…";
    try { await walkFile(file); render(); } catch (e) { if (lbl) lbl.firstChild.textContent = "Add a file"; walkErr(e.message); }
    return;
  }
  const sel = ev.target.closest("select[data-stage]");
  if (sel) { try { await post(`/stages/${sel.dataset.stage}`, { record_kind: sel.value }); await load(true); } catch (e) { S.err = e.message; render(); } return; }
  if (ev.target.id === "importfile") {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const doc = JSON.parse(await file.text());
      if (S.ov.maps.length && !confirm("Replace this company's whole map with the file?")) return;
      await post("/import", doc); S.mapId = null; S.err = ""; await load(false);
    } catch (e) { S.err = e.message || "That file could not be read."; render(); }
  }
});
// Arrange: drag a box; its flows follow; the place is saved on drop (8 px grid)
app.addEventListener("pointerdown", (ev) => {
  if (!S.arrange) return;
  const el = ev.target.closest(".host .node"); if (!el) return;
  const n = S.view.nodes.find((x) => x.key === el.dataset.node); if (!n) return;
  drag = { n, sx: ev.clientX, sy: ev.clientY, x0: n.x, y0: n.y, moved: false };
  el.setPointerCapture(ev.pointerId); ev.preventDefault();
});
app.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  drag.n.x = Math.max(0, Math.round((drag.x0 + dx / S.z) / 8) * 8); drag.n.y = Math.max(0, Math.round((drag.y0 + dy / S.z) / 8) * 8);
  const host = document.getElementById("host");
  host.outerHTML = mapHtml(); layoutAfter();
});
app.addEventListener("pointerup", async () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  try { await post(`/nodes/${d.n.id}`, { x: d.n.x, y: d.n.y }); } catch (e) { d.n.x = d.x0; d.n.y = d.y0; S.err = e.message; render(); }
});
load(false).catch((e) => { document.getElementById("app").innerHTML = `<div class="card empty"><div class="err">${esc(e.message)}</div></div>`; });
</script>
