<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/assets/anetix-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/anetix-touch-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anetix · Value stream map</title>
<!-- The value stream map, the board's other view (src/vsm.js, docs/VSM.md, milestone M1). Managers and admins.
     Information on top, material below, inventory between steps, the timeline ladder at the bottom; every box
     colored by where its record lives. Built with the board's own look (principles/STYLE.md). -->
<style>
  :root { --ink:#1c242e; --steel:#51606f; --line:#d5dbe3; --fog:#f2f4f7; --navy:#1f3a5f; --amber:#c2620a; --amberDeep:#9a4a05;
          --green:#2e7d4f; --greenSoft:#e3efe7; --red:#b3261e; --gold:#e8b04a;
          --anetix:#1f3a5f; --next:#dfe7f1; --other:#a9bccd; --paper:#f5cf9f; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,sans-serif; background:var(--fog); color:var(--ink); padding:0 0 56px; font-size:13px; line-height:1.45; }
  a { color:var(--navy); }
  button { font:inherit; }
  .band { background:var(--navy); color:#fff; padding:8px 22px 7px; }
  .band .inner { display:flex; align-items:center; gap:14px; max-width:1900px; margin:0 auto; flex-wrap:wrap; min-height:30px; }
  .band h1 { font-size:17px; font-weight:800; display:flex; align-items:center; gap:9px; }
  .band h1 small { font-size:12.5px; opacity:.75; font-weight:500; }
  .band h1 img.mark { width:22px; height:22px; border-radius:5px; background:#fff; }
  .views { display:inline-flex; gap:2px; background:rgba(255,255,255,.12); border-radius:8px; padding:2px; }
  .views a { color:#fff; text-decoration:none; font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:6px; opacity:.85; }
  .views a.on { background:#fff; color:var(--navy); opacity:1; }
  .band .right { margin-left:auto; font-size:12px; opacity:.9; }
  .band .right a { color:#fff; }
  .wrap { max-width:1900px; margin:0 auto; padding:18px 22px; display:flex; flex-direction:column; gap:16px; }
  .head { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .seg { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; }
  .seg button { border:none; background:none; border-radius:7px; min-height:36px; padding:0 12px; font-weight:700; color:var(--navy); cursor:pointer; }
  .seg button.on { background:var(--navy); color:#fff; }
  .pill { border:1.5px solid var(--navy); background:#fff; color:var(--navy); border-radius:999px; min-height:36px; padding:0 13px; font-weight:700; cursor:pointer; }
  .pill.on { background:var(--navy); color:#fff; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); }
  .quietbtn { background:#e5e9ee; border:none; border-radius:8px; min-height:36px; padding:0 12px; font-weight:700; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(150px,100%),1fr)); gap:10px; }
  .tile { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .tile.lead { background:var(--navy); color:#fff; border-color:var(--navy); }
  .tile.lead .lbl, .tile.lead .sm { color:#dbe4ef; }
  .tile .big { font-size:26px; font-weight:800; line-height:1.15; }
  .tile .big small { font-size:13px; font-weight:600; opacity:.75; }
  .tile .sm { font-size:12px; color:var(--steel); }
  .bar { display:flex; height:26px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .bar div { display:flex; align-items:center; padding:0 9px; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; }
  .maphead { display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); }
  .scroller { overflow:auto; padding:12px; }
  .host { position:relative; }
  .host svg.edges { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .bandbg { position:absolute; background:#e6ebf1; border:1px solid #c9d2dd; border-radius:10px; }
  .bandlbl { position:absolute; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--steel); text-transform:uppercase; }
  .bandnote { position:absolute; font-size:11.5px; color:var(--steel); text-align:right; }
  .node { position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; cursor:pointer; line-height:16px; font-size:13px;
          border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:4px; user-select:none; }
  .node b { display:block; }
  .node .s { display:block; font-size:11.5px; opacity:.9; }
  .node.control { border-radius:8px; }
  /* a supplier, a customer and an outside shop wear the VSM factory roof */
  .node.supplier, .node.customer, .node.outside { border-radius:0; overflow:visible; }
  .node.supplier::before, .node.customer::before, .node.outside::before { content:""; position:absolute; left:-2px; top:-15px; width:58%; height:14px; background:var(--ink);
    clip-path:polygon(0 100%, 0 0, 33% 100%, 33% 0, 66% 100%, 66% 0, 100% 100%); }
  .node.sel { box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--amber); z-index:3; }
  .sys .node.r-anetix { background:var(--anetix); color:#fff; border-color:var(--anetix); }
  .sys .node.r-next { background:var(--next); color:var(--navy); border:2px dashed var(--navy); }
  .sys .node.r-other { background:var(--other); color:#14202c; }
  .sys .node.r-paper { background:var(--paper); color:#3d2000; }
  .sys .node.r-none { background:repeating-linear-gradient(135deg,#fff 0 6px,#e3e7ec 6px 12px); border:2px dashed #6b7785; }
  .arrange .node { cursor:grab; }
  .arrange .node:active { cursor:grabbing; }
  .databox { position:absolute; border:1px solid var(--ink); background:#fff; font-size:11.5px; line-height:16px; padding:6px 8px; }
  .databox b { font-weight:700; }
  .databox .unk { color:var(--steel); }
  .elabel { position:absolute; font-size:12px; line-height:15px; color:var(--steel); text-align:center; pointer-events:none; }
  .elabel.word { color:#7a3a00; } .elabel.sys { color:var(--navy); }
  .tri { position:absolute; width:30px; height:26px; background:var(--gold); clip-path:polygon(50% 0,100% 100%,0 100%); display:flex; align-items:flex-end; justify-content:center; font-size:12px; font-weight:800; pointer-events:none; }
  .trilbl { position:absolute; font-size:12px; color:var(--steel); text-align:center; width:56px; pointer-events:none; }
  .kz { position:absolute; width:34px; height:34px; background:var(--amber); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; z-index:4; cursor:pointer;
        clip-path:polygon(50% 0%,61% 18%,80% 9%,79% 30%,100% 33%,86% 50%,100% 67%,79% 70%,80% 91%,61% 82%,50% 100%,39% 82%,20% 91%,21% 70%,0% 67%,14% 50%,0% 33%,21% 30%,20% 9%,39% 18%); border:none; }
  .agent { position:absolute; height:24px; border:1.5px dotted var(--navy); border-radius:999px; background:#fff; color:var(--navy); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; white-space:nowrap; overflow:hidden; pointer-events:none; }
  .ladder { position:absolute; display:flex; font-size:11.5px; color:var(--steel); }
  .ladder .w { border-top:2px solid var(--ink); text-align:center; padding-top:4px; flex:none; }
  .ladder .p { border:2px solid var(--ink); border-top:none; display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px; flex:none; }
  .lower { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .detail { flex:2 1 600px; min-width:0; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .side { flex:1 1 380px; min-width:0; display:flex; flex-direction:column; gap:16px; }
  .side .card { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; background:#eef0f3; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(250px,100%),1fr)); gap:12px 22px; }
  .quote { background:var(--fog); border-radius:8px; padding:12px 14px; }
  .quote blockquote { font-style:italic; font-size:14px; }
  .quote figcaption { font-size:12px; color:var(--steel); margin-top:4px; }
  .tools a { font-weight:700; }
  .q { border-top:1px solid #e3e7ec; padding-top:10px; display:flex; flex-direction:column; gap:6px; }
  .q:first-of-type { border-top:none; padding-top:0; }
  .q .claim { font-weight:700; }
  .q .why { color:var(--steel); }
  .q .acts { display:flex; flex-wrap:wrap; gap:8px; }
  .ok { border:1.5px solid var(--green); background:#fff; color:#1d5535; border-radius:8px; min-height:38px; padding:0 12px; font-weight:700; cursor:pointer; }
  .fix { border:1.5px solid var(--amberDeep); background:#fff; color:#7a3a00; border-radius:8px; min-height:38px; padding:0 12px; font-weight:700; cursor:pointer; }
  .go { background:var(--navy); color:#fff; border:none; border-radius:8px; min-height:38px; padding:0 14px; font-weight:700; cursor:pointer; }
  textarea, input[type=text], select { font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; background:#fff; }
  textarea { min-height:60px; resize:vertical; }
  .st-confirmed { color:#1d5535; font-weight:700; } .st-fix { color:#7a3a00; font-weight:700; } .st-open { color:var(--steel); font-weight:700; }
  .form { display:flex; flex-direction:column; gap:10px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-weight:600; }
  .row2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(200px,100%),1fr)); gap:10px; }
  .dr { display:grid; grid-template-columns:1fr 2fr auto; gap:6px; align-items:center; }
  .x { border:none; background:none; color:var(--red); font-weight:800; font-size:16px; cursor:pointer; min-width:32px; min-height:32px; }
  .legend div { display:flex; align-items:center; gap:10px; }
  .legend .sw { width:28px; height:16px; border-radius:3px; flex:none; }
  table.stages { width:100%; border-collapse:collapse; min-width:900px; }
  table.stages th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel); padding:10px; border-bottom:1px solid var(--line); }
  table.stages td { padding:9px 10px; border-bottom:1px solid #e9ecf0; vertical-align:top; }
  details.stagesbox > summary { cursor:pointer; padding:14px 16px; font-weight:700; font-size:15px; list-style-position:inside; }
  .note { color:var(--steel); font-size:12px; }
  .empty { padding:28px; text-align:center; color:var(--steel); }
  .err { background:#fbe3e1; color:#7d1a14; border-radius:8px; padding:10px 12px; }
  .feed .m { border-top:1px solid #e3e7ec; padding-top:8px; display:flex; flex-direction:column; gap:3px; }
  .feed .m:first-of-type { border-top:none; padding-top:0; }
  .feed .who { font-size:12px; font-weight:700; color:var(--navy); }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; }
  @media (max-width:700px) { .wrap { padding:12px; } .band { padding:8px 12px; } .band .right { margin-left:0; } }
</style>
</head>
<body>
<div class="band"><div class="inner">
  <h1><img class="mark" id="comark" alt="">Value stream map <small id="coname"></small></h1>
  <nav class="views" aria-label="Views"><a href="./">Kaizen</a><a class="on" href="map" aria-current="page">Map</a></nav>
  <span class="right" id="who"></span>
</div></div>
<main class="wrap" id="app"><div class="empty">Loading the map…</div></main>
<script>
const SLUG = (location.pathname.split("/")[2] || "").toLowerCase();
const API = `/api/c/${SLUG}/vsm`;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REC = { anetix: "In Anetix", next: "Anetix, rolling out", other: "Another system", paper: "Paper, email or word of mouth", none: "No record" };
const CONF = { heard: ["Heard on a walk-through", "#e3efe7", "#1d5535"], seen: ["Seen in a tool or document", "#dfe7f1", "#1f3a5f"], assumed: ["Assumed, needs a person to confirm", "#fbe3cc", "#7a3a00"], confirmed: ["Confirmed", "#e3efe7", "#1d5535"] };
const EDGE = { push: ["#1c242e", 3, ""], pull: ["#1c242e", 3, "2 5"], fifo: ["#1c242e", 3, ""], supermarket: ["#1c242e", 3, ""], supply: ["#1c242e", 3, ""], ship: ["#1c242e", 3, ""], info_system: ["#1f3a5f", 2, ""], info_word: ["#c2620a", 2, "6 5"] };
const S = { ov: null, mapId: null, view: null, sel: null, layers: { sys: true, agents: false, kz: true, ladder: true }, arrange: false, editing: false, fixing: null, err: "", fit: true, z: 1 };

async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({ cache: "no-store", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (r.status === 401 || r.status === 403) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; throw new Error("sign in"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "That did not work. Try again.");
  return j;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });

async function load(keepSel) {
  S.ov = await api("");
  const co = S.ov.company || {};
  document.getElementById("coname").textContent = co.name || "";
  document.title = `${co.name || "Map"} · Value stream map`;
  const mark = document.getElementById("comark"); mark.src = `/api/c/${SLUG}/icon`; mark.onerror = () => { mark.style.display = "none"; };
  document.getElementById("who").innerHTML = `signed in as <b>${esc(S.ov.role)}</b>${S.ov.role === "admin" ? ' · <a href="/admin">admin</a>' : ""} · <a href="/c/${esc(SLUG)}/settings">Settings</a> · <a href="/logout">sign out</a>`;
  if (!S.ov.maps.length) { S.view = null; return render(); }
  const want = Number(new URLSearchParams(location.search).get("map")) || S.mapId;
  S.mapId = S.ov.maps.some((m) => m.id === want) ? want : S.ov.maps[0].id;
  S.view = await api(`/maps/${S.mapId}`);
  if (!keepSel || !S.view.nodes.some((n) => n.key === S.sel)) S.sel = (S.view.nodes.find((n) => n.kind === "control") || S.view.nodes[0] || {}).key || null;
  render();
}

// ---------- coverage
function coverageHtml() {
  const c = S.ov.coverage, t = c.total || 0;
  if (!t) return "";
  const pct = (n) => (t ? Math.round((n / t) * 100) : 0);
  const seg = (n, bg, fg, label) => (n ? `<div style="flex:${n} 1 0;background:${bg};color:${fg}" title="${esc(label)}: ${n}">${esc(label)} · ${n}</div>` : "");
  return `<section aria-label="Plant coverage" class="tiles">
    <div class="tile lead"><span class="lbl">Tool built</span><span class="big">${pct(c.built)}% <small>${c.built} of ${t} stages</small></span><span class="sm">a stage whose record is an Anetix tool that is live</span></div>
    <div class="tile"><span class="lbl">In daily use</span><span class="big">${c.daily} <small>of ${t}</small></span><span class="sm">its tool changed by the plant on ${c.rule.min_days} or more of the last ${c.rule.days} days</span></div>
    <div class="tile"><span class="lbl">Another system</span><span class="big">${c.other} <small>of ${t}</small></span><span class="sm">Shopify, Fishbowl, HubSpot, QuickBooks</span></div>
    <div class="tile"><span class="lbl">Paper, email or word of mouth</span><span class="big">${c.paper} <small>of ${t}</small></span></div>
    <div class="tile"><span class="lbl">No record</span><span class="big" style="color:var(--red)">${c.none} <small>of ${t}</small></span></div>
    <div class="tile"><span class="lbl">Review</span><span class="big">${S.ov.questions_open} <small>open</small></span><span class="sm">places the map is guessing</span></div>
  </section>
  <div class="bar" role="img" aria-label="Stages by where their record lives">${seg(c.built, "var(--anetix)", "#fff", "Tool built")}${seg(c.anetix_without_tool + c.next, "var(--next)", "var(--navy)", "Anetix, not live")}${seg(c.other, "var(--other)", "#14202c", "Another system")}${seg(c.paper, "var(--paper)", "#3d2000", "Paper or word of mouth")}${seg(c.none, "repeating-linear-gradient(135deg,#fff 0 6px,#e3e7ec 6px 12px)", "var(--ink)", "No record")}</div>`;
}

// ---------- geometry
const byKey = () => Object.fromEntries(S.view.nodes.map((n) => [n.key, n]));
function port(n, side, at) {
  if (side === "left") return [n.x, n.y + n.h * at];
  if (side === "right") return [n.x + n.w, n.y + n.h * at];
  if (side === "top") return [n.x + n.w * at, n.y];
  return [n.x + n.w * at, n.y + n.h];
}
const horiz = (s) => s === "left" || s === "right";
function route(e, nodes) {
  const a = nodes[e.from_key], b = nodes[e.to_key];
  if (!a || !b) return null;
  const p = port(a, e.from_side, e.from_at), r = port(b, e.to_side, e.to_at);
  if (horiz(e.from_side) && horiz(e.to_side)) { if (Math.abs(p[1] - r[1]) < 1) return [p, r]; const m = Math.round((p[0] + r[0]) / 2); return [p, [m, p[1]], [m, r[1]], r]; }
  if (!horiz(e.from_side) && !horiz(e.to_side)) { if (Math.abs(p[0] - r[0]) < 1) return [p, r]; const m = Math.round((p[1] + r[1]) / 2); return [p, [p[0], m], [r[0], m], r]; }
  if (horiz(e.from_side)) return [p, [r[0], p[1]], r];
  return [p, [p[0], r[1]], r];
}
const dataH = (n) => (n.kind === "process" ? Math.max(40, 14 + 16 * (2 + (n.data || []).length + (n.who ? 1 : 0))) : 0);

function mapHtml() {
  const v = S.view, nodes = byKey(), L = v.map.layout || {};
  let W = 0, H = 0;
  for (const n of v.nodes) { W = Math.max(W, n.x + n.w + 40); H = Math.max(H, n.y + n.h + (dataH(n) ? dataH(n) + 8 : 0) + 40); }
  for (const b of L.bands || []) { W = Math.max(W, b.x + b.w + 24); H = Math.max(H, b.y + b.h + 24); }
  const procs = v.nodes.filter((n) => n.kind === "process").sort((a, b) => a.x - b.x);
  const ladderY = L.ladder_y != null ? L.ladder_y : (procs.length ? Math.max(...procs.map((n) => n.y + n.h + dataH(n) + 48)) : 0);
  if (S.layers.ladder && procs.length) H = Math.max(H, ladderY + 80);
  if (S.layers.agents) H += 0;
  let svg = "", html = "";
  for (const b of L.bands || []) html += `<div class="bandbg" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"></div><div class="bandlbl" style="left:${b.x + 16}px;top:${b.y + 8}px">${esc(b.label)}</div><div class="bandnote" style="left:${b.x + 240}px;width:${Math.max(80, b.w - 256)}px;top:${b.y + 8}px">${esc(b.note || "")}</div>`;
  const defs = Object.entries({ k: "#1c242e", n: "#1f3a5f", o: "#c2620a" }).map(([id, c]) => `<marker id="h-${id}" orient="auto" markerWidth="5" markerHeight="5" refX="3" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="${c}"/></marker>`).join("");
  for (const e of v.edges) {
    const pts = route(e, nodes); if (!pts) continue;
    const [color, width, dash] = EDGE[e.kind] || EDGE.push;
    const m = color === "#1f3a5f" ? "n" : color === "#c2620a" ? "o" : "k";
    // stop short of the box so the head sits on its edge
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const dx = Math.sign(last[0] - prev[0]), dy = Math.sign(last[1] - prev[1]), back = width * 2;
    const draw = pts.slice(0, -1).concat([[last[0] - dx * back, last[1] - dy * back]]);
    svg += `<polyline points="${draw.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="${width}" ${dash ? `stroke-dasharray="${dash}"` : ""} stroke-linejoin="round" stroke-linecap="round" marker-end="url(#h-${m})"/>`;
    // the label sits by the longest segment
    let best = 0, seg = [pts[0], pts[1]];
    for (let i = 0; i < pts.length - 1; i++) { const d = Math.abs(pts[i + 1][0] - pts[i][0]) + Math.abs(pts[i + 1][1] - pts[i][1]); if (d > best) { best = d; seg = [pts[i], pts[i + 1]]; } }
    const cls = e.kind === "info_word" ? "word" : e.kind === "info_system" ? "sys" : "";
    if (e.label) {
      const boxes = v.nodes.map((n) => [n.x - 4, n.y - 4, n.x + n.w + 4, n.y + n.h + (n.kind === "process" ? dataH(n) + 12 : 4)]);
      const clear = (r) => !boxes.some((b) => r[0] < b[2] && r[2] > b[0] && r[1] < b[3] && r[3] > b[1]);
      if (seg[0][1] === seg[1][1]) {
        const mx = (seg[0][0] + seg[1][0]) / 2, w = Math.min(170, Math.max(70, best - 16)), y = seg[0][1];
        const above = [mx - w / 2, y - 36, mx + w / 2, y - 4];
        const top = clear(above) ? y - 36 : y + 6;
        html += `<div class="elabel ${cls}" style="left:${mx - w / 2}px;top:${top}px;width:${w}px;height:32px;display:flex;align-items:${top < y ? "flex-end" : "flex-start"};justify-content:center">${esc(e.label)}</div>`;
      } else {
        const my = (seg[0][1] + seg[1][1]) / 2, x = seg[0][0], w = 150;
        const left = [x - 10 - w, my - 15, x - 10, my + 15];
        const onLeft = clear(left);
        html += `<div class="elabel ${cls}" style="left:${onLeft ? x - 10 - w : x + 10}px;top:${my - 15}px;width:${w}px;height:30px;display:flex;align-items:center;justify-content:${onLeft ? "flex-end" : "flex-start"};text-align:${onLeft ? "right" : "left"}">${esc(e.label)}</div>`;
      }
    }
    if (e.inventory) {   // the triangle sits above the material flow, in the middle of its last straight run
      const a = pts[pts.length - 2], b2 = pts[pts.length - 1];
      if (a[1] === b2[1]) { const mx = (a[0] + b2[0]) / 2; html += `<div class="tri" style="left:${mx - 15}px;top:${a[1] - 34}px">I</div><div class="trilbl" style="left:${mx - 28}px;top:${a[1] + 8}px">${esc(e.inventory.label || "?")}</div>`; }
    }
  }
  for (const n of v.nodes) {
    const cls = `node ${n.kind} r-${n.record_kind}${n.key === S.sel ? " sel" : ""}`;
    html += `<button type="button" class="${cls}" data-node="${esc(n.key)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" aria-label="${esc(n.label)}${n.sub ? ", " + esc(n.sub) : ""}: ${esc(REC[n.record_kind])}"><span><b>${esc(n.label)}</b>${n.sub ? `<span class="s">${esc(n.sub)}</span>` : ""}</span></button>`;
    if (n.kind === "process") {
      const rows = [`<b>Stage</b> ${esc((n.stage_refs || []).join(", ") || "?")}`].concat(n.who ? [`<b>Who</b> ${esc(n.who)}`] : [], (n.data || []).map((d) => `<b>${esc(d.label)}</b> <span class="${d.value === "?" ? "unk" : ""}">${esc(d.value)}</span>`), [`<b>Record</b> ${esc(n.record_system || REC[n.record_kind])}`]);
      html += `<div class="databox" data-node="${esc(n.key)}" style="left:${n.x}px;top:${n.y + n.h + 8}px;width:${n.w}px;min-height:${dataH(n)}px">${rows.join("<br>")}</div>`;
    }
    if (S.layers.agents && n.detail && n.detail.agent_name) {
      const factory = ["supplier", "customer", "outside"].includes(n.kind);
      const top = n.kind === "process" ? n.y + n.h + 8 + dataH(n) + 8 : n.y - (factory ? 46 : 30);
      html += `<div class="agent" data-for="${esc(n.key)}" style="left:${n.x}px;top:${top}px;width:${n.kind === "process" ? n.w : n.w - 24}px">${esc(n.detail.agent_name)}</div>`;
    }
  }
  if (S.layers.kz) for (const z of v.kaizen) { const n = nodes[z.node_key]; if (n) html += `<button type="button" class="kz" data-node="${esc(n.key)}" style="left:${n.x + n.w - 18}px;top:${n.y - 18}px" title="${esc(z.title)}" aria-label="Kaizen ${z.n}: ${esc(z.title)}">${z.n}</button>`; }
  if (S.layers.ladder && procs.length) {
    const inv = (n) => { const e = v.edges.find((x) => x.to_key === n.key && x.inventory); return e ? e.inventory.label || "?" : "?"; };
    const ct = (n) => { const d = (n.data || []).find((r) => /^(C\/T|Time on rack)$/i.test(r.label)); return d ? d.value : "?"; };
    let x0 = Math.max(0, procs[0].x - 64), cells = "";
    let at = x0;
    for (const n of procs) {
      cells += `<div class="w" style="width:${n.x - at}px">${esc(inv(n))}</div><div class="p" style="width:${n.w}px">${esc(ct(n))}</div>`;
      at = n.x + n.w;
    }
    html += `<div class="ladder" id="ladder" data-min="${ladderY}" style="left:${x0}px;top:${ladderY}px;height:52px">${cells}</div>`;
    H = Math.max(H, ladderY + 70);
  }
  return `<div class="host ${S.layers.sys ? "sys" : ""} ${S.arrange ? "arrange" : ""}" id="host" style="width:${W}px;height:${H}px"><svg class="edges" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>${defs}</defs>${svg}</svg>${html}</div>`;
}

// The data boxes wrap their words, so their heights are only known once drawn: the agent chips and the ladder move
// below them, the map grows to hold them, and then it is fitted to the screen when it is wider than it.
function layoutAfter() {
  const host = document.getElementById("host"); if (!host) return;
  host.style.zoom = 1;
  let bottom = 0;
  host.querySelectorAll(".databox").forEach((d) => {
    const b = d.offsetTop + d.offsetHeight; bottom = Math.max(bottom, b);
    const chip = host.querySelector(`.agent[data-for="${d.dataset.node}"]`);
    if (chip) { chip.style.top = `${b + 8}px`; bottom = Math.max(bottom, b + 32); }
  });
  const lad = document.getElementById("ladder");
  if (lad) { const top = Math.max(Number(lad.dataset.min) || 0, bottom + 28); lad.style.top = `${top}px`; bottom = Math.max(bottom, top + 56); }
  const h = Math.max(parseInt(host.style.height, 10) || 0, bottom + 24);
  host.style.height = `${h}px`;
  const svg = host.querySelector("svg.edges"); const w = parseInt(host.style.width, 10) || 0;
  svg.setAttribute("height", h); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const sc = host.parentElement, z = Math.min(1, (sc.clientWidth - 24) / w);
  S.z = S.fit && z >= 0.45 ? z : 1;
  host.style.zoom = S.z;
}

    const c = CONF[q.confidence] || CONF.assumed;

      ? `<textarea id="fixtext" placeholder="What is right?" aria-label="What is right">${esc(q.answer)}</textarea><div class="acts"><button type="button" class="go" data-act="savefix" data-q="${q.id}">Save the fix</button><button type="button" class="quietbtn" data-act="cancelfix">Cancel</button></div>`

// ---------- events (delegated: no free text ever goes into an inline handler)
const app = document.getElementById("app");
let drag = null, suppressClick = false;
app.addEventListener("click", async (ev) => {
  if (suppressClick) { suppressClick = false; return; }
  const t = ev.target.closest("[data-map],[data-layer],[data-node],[data-act]");
  if (!t) return;
  try {
    if (t.dataset.map) { S.mapId = Number(t.dataset.map); S.sel = null; S.editing = false; history.replaceState(null, "", `?map=${S.mapId}`); S.view = await api(`/maps/${S.mapId}`); S.sel = (S.view.nodes.find((n) => n.kind === "control") || S.view.nodes[0] || {}).key; return render(); }
    if (t.dataset.layer) { S.layers[t.dataset.layer] = !S.layers[t.dataset.layer]; return render(); }
    if (t.dataset.node !== undefined && !t.dataset.act) { if (!t.dataset.node) return; S.sel = t.dataset.node; S.editing = false; S.err = ""; render(); if (!t.closest(".host")) document.getElementById("host").scrollIntoView({ block: "nearest" }); return; }
    const act = t.dataset.act;
    if (act === "arrange") { S.arrange = !S.arrange; return render(); }
    if (act === "fit") { S.fit = !S.fit; return render(); }
    if (act === "edit") { S.editing = true; S.err = ""; return render(); }
    if (act === "canceledit") { S.editing = false; S.err = ""; return render(); }
    if (act === "addrow") { document.getElementById("drows").insertAdjacentHTML("beforeend", `<div class="dr"><input type="text" name="dl" aria-label="Label"><input type="text" name="dv" value="?" aria-label="Value"><button type="button" class="x" data-act="droprow" aria-label="Remove this row">×</button></div>`); return; }
    if (act === "droprow") { t.closest(".dr").remove(); return; }
    if (act === "confirm") { await post(`/questions/${t.dataset.q}/answer`, { status: "confirmed" }); S.err = ""; return load(true); }
    if (act === "reopen") { await post(`/questions/${t.dataset.q}/answer`, { status: "open" }); S.err = ""; return load(true); }
    if (act === "startfix") { S.fixing = Number(t.dataset.q); S.err = ""; render(); const ta = document.getElementById("fixtext"); if (ta) ta.focus(); return; }
    if (act === "cancelfix") { S.fixing = null; S.err = ""; return render(); }
    if (act === "savefix") { await post(`/questions/${t.dataset.q}/answer`, { status: "fix", answer: document.getElementById("fixtext").value }); S.fixing = null; S.err = ""; return load(true); }
  } catch (e) { S.err = e.message; render(); }
});
app.addEventListener("submit", async (ev) => {
  if (ev.target.id !== "editform") return;
  ev.preventDefault();
  const f = ev.target, n = S.view.nodes.find((x) => x.key === S.sel);
  const body = { label: f.label.value, sub: f.sub.value, who: f.who.value, record_kind: f.record_kind.value, record_system: f.record_system.value, notes: f.notes.value,
    modules: [...f.querySelectorAll("input[name=mod]:checked")].map((i) => i.value) };
  if (n.kind === "process") { const ls = [...f.querySelectorAll("input[name=dl]")], vs = [...f.querySelectorAll("input[name=dv]")]; body.data = ls.map((l, i) => ({ label: l.value, value: vs[i].value })).filter((r) => r.label.trim()); }
  try { await post(`/nodes/${n.id}`, body); S.editing = false; S.err = ""; await load(true); } catch (e) { S.err = e.message; render(); }
});
app.addEventListener("change", async (ev) => {
  const sel = ev.target.closest("select[data-stage]");
  if (sel) { try { await post(`/stages/${sel.dataset.stage}`, { record_kind: sel.value }); await load(true); } catch (e) { S.err = e.message; render(); } return; }
  if (ev.target.id === "importfile") {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const doc = JSON.parse(await file.text());
      if (S.ov.maps.length && !confirm("Replace this company's whole map with the file?")) return;
      await post("/import", doc); S.mapId = null; S.err = ""; await load(false);
    } catch (e) { S.err = e.message || "That file could not be read."; render(); }
  }
});
// Arrange: drag a box; its flows follow; the place is saved on drop (8 px grid)
app.addEventListener("pointerdown", (ev) => {
  if (!S.arrange) return;
  const el = ev.target.closest(".host .node"); if (!el) return;
  const n = S.view.nodes.find((x) => x.key === el.dataset.node); if (!n) return;
  drag = { n, sx: ev.clientX, sy: ev.clientY, x0: n.x, y0: n.y, moved: false };
  el.setPointerCapture(ev.pointerId); ev.preventDefault();
});
app.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  drag.n.x = Math.max(0, Math.round((drag.x0 + dx / S.z) / 8) * 8); drag.n.y = Math.max(0, Math.round((drag.y0 + dy / S.z) / 8) * 8);
  const host = document.getElementById("host");
  host.outerHTML = mapHtml(); layoutAfter();
});
app.addEventListener("pointerup", async () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  try { await post(`/nodes/${d.n.id}`, { x: d.n.x, y: d.n.y }); } catch (e) { d.n.x = d.x0; d.n.y = d.y0; S.err = e.message; render(); }
});
load(false).catch((e) => { document.getElementById("app").innerHTML = `<div class="card empty"><div class="err">${esc(e.message)}</div></div>`; });
</script>
</body>
</html>
