<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work center</title>
<style>
  :root { --ink:#1c242e; --steel:#51606f; --line:#d5dbe3; --fog:#f2f4f7; --ok:#2e7d4f; --warn:#c2620a; --bad:#b3261e; --navy:#1f3a5f; --hot:#b3261e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui, sans-serif; background:var(--fog); color:var(--ink); font-size:14px; padding:14px 16px 64px; }
  a { color:var(--navy); }
  header.top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  header.top h1 { font-size:21px; }
  header.top .day { color:var(--steel); font-size:13px; }
  nav.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  nav.tabs a { text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:18px; padding:7px 12px; font-weight:600; font-size:13px; color:var(--ink); }
  nav.tabs a.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
  .card h2 { font-size:15px; margin-bottom:8px; }
  .sub { color:var(--steel); font-size:12.5px; line-height:1.45; }
  .pill { display:inline-block; border-radius:12px; padding:2px 9px; font-size:11.5px; font-weight:700; color:#fff; white-space:nowrap; }
  .pill.ok { background:var(--ok); } .pill.risk { background:var(--warn); } .pill.late { background:var(--bad); } .pill.shipped { background:#7a8794; } .pill.hot { background:var(--hot); }
  .pill.quiet { background:#e5e9ee; color:var(--ink); }
  .red { color:var(--bad); font-weight:700; } .amber { color:var(--warn); font-weight:700; } .green { color:var(--ok); font-weight:700; }
  table.list { width:100%; border-collapse:collapse; }
  table.list th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--steel); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.list td { padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.list tr:last-child td { border-bottom:none; }
  .wrap { overflow-x:auto; }
  button, .btn { border:none; border-radius:8px; padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; min-height:40px; }
  button.go { background:var(--ok); color:#fff; } button.main { background:var(--navy); color:#fff; } button.quiet { background:#e5e9ee; color:var(--ink); }
  button.warn { background:#fff; color:var(--bad); border:2px solid var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  #msg { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-weight:600; display:none; z-index:30; max-width:90vw; }
  #msg.bad { background:var(--bad); }
  .banner { background:#fff7e8; border:1px solid #f0c98a; border-radius:10px; padding:10px 14px; margin-top:10px; font-size:13px; }
  .banner.red { background:#fdeceb; border-color:#f1b5b0; color:var(--ink); font-weight:400; }
  body { max-width:900px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; margin-top:12px; }
  .tile { display:block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; text-decoration:none; color:var(--ink); }
  .tile b { font-size:18px; display:block; margin-bottom:6px; }
  .tile .sub { font-size:13px; }
  .who { display:flex; gap:8px; align-items:center; margin-top:4px; }
  .job { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:10px; }
  .job.first { border:2px solid var(--navy); }
  .job .no { font-size:22px; font-weight:800; }
  .job .line { font-size:15px; margin-top:4px; }
  .job .meta { font-size:13px; color:var(--steel); margin-top:6px; line-height:1.5; }
  .job .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .job .row button { flex:1; min-height:52px; font-size:17px; }
  .tag { display:inline-block; background:var(--navy); color:#fff; border-radius:10px; font-size:11px; font-weight:700; padding:2px 8px; vertical-align:4px; margin-left:6px; }
  h2.sec { font-size:16px; margin-top:20px; }
  .bar { height:12px; background:#e5e9ee; border-radius:6px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .bar i.over { background:var(--bad); } .bar i.near { background:var(--warn); }
</style>
</head>
<body>
<header class="top"><h1 id="title">Work centers</h1><span class="day" id="day"></span>
  <nav class="tabs" id="nav"><a href="#" data-to="">Board</a><a href="#" data-to="/meeting">Morning meeting</a><a href="#" data-to="/centers">Work centers</a><a href="#" data-to="/load">Load</a><a href="#" data-to="/setup">Setup</a></nav></header>
<div id="app"></div>
<div id="msg"></div>
<script>
const base = location.pathname.match(/^.*?\/(?:staging\/)?m\/[^/]+/)[0];
const rest = location.pathname.slice(base.length).replace(/\/$/, "");
const TODAY = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function myName() { try { return localStorage.getItem("sos.name") || ""; } catch (e) { return ""; } }
function setName(v) { try { localStorage.setItem("sos.name", v); } catch (e) {} }
async function api(path, body) {
  const url = base + path + (path.includes("?") ? "&" : "?") + "today=" + TODAY;
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...body, who: myName() || undefined }) } : { cache: "no-store" });
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname); throw new Error("Sign in first."); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 403) throw new Error("Only a manager can do that.");
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
let msgTimer = null;
function say(text, bad) { const m = document.getElementById("msg"); m.textContent = text; m.className = bad ? "bad" : ""; m.style.display = "block"; clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.style.display = "none"; }, bad ? 5000 : 2500); }
async function act(path, body, okText, after) { try { const j = await api(path, body || {}); if (okText) say(okText); if (after) await after(j); return j; } catch (e) { say(e.message, true); return null; } }
const D = (s) => new Date(String(s).slice(0, 10) + "T12:00:00");
function day(s) { return s ? D(s).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) : ""; }
function short(s) { return s ? D(s).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : ""; }
function between(a, b) { return Math.round((D(b) - D(a)) / 86400000); }
function workdaysBetween(a, b) { let n = 0, d = D(a); const end = D(b); while (d < end) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w > 0 && w < 6) n++; } return n; }
function plural(n, w) { return `${n} ${w}${n === 1 ? "" : "s"}`; }
function hrs(h) { h = Number(h) || 0; return (Math.round(h * 10) / 10) + " h"; }
function ago(t) { if (!t) return ""; const d = (Date.now() - new Date(t)) / 86400000; return d < 1 ? "today" : d < 2 ? "1 day" : Math.floor(d) + " days"; }
const STATE = { ok: ["ok", "On track"], risk: ["risk", "At risk"], late: ["late", "Late"], shipped: ["shipped", "Shipped"] };
function pill(state) { const s = STATE[state] || ["quiet", state]; return `<span class="pill ${s[0]}">${s[1]}</span>`; }
function slackText(n) { return n == null ? "" : n < 0 ? `<span class="red">${plural(-n, "day")} late</span>` : n < 3 ? `<span class="amber">${plural(n, "day")} to spare</span>` : `<span class="green">${plural(n, "day")} to spare</span>`; }
function go(to) { location.href = base + to; }
document.getElementById("day").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
for (const a of document.querySelectorAll("#nav a")) {
  a.href = base + a.dataset.to + (a.dataset.to ? "" : "/");
  const on = a.dataset.to === "" ? rest === "" : rest.startsWith(a.dataset.to) || (a.dataset.to === "/centers" && rest.startsWith("/center"));
  if (on) a.classList.add("on");
}
const cid = rest.startsWith("/center/") ? Number(rest.split("/")[2]) : null;
async function picker() {
  const r = await api("/api/centers");
  document.getElementById("app").innerHTML = `<p class="sub">Pick your work center. Bookmark it on the tablet that lives there.</p><div class="grid" id="centers">${r.centers.map(c =>
    `<a class="tile" href="${base}/center/${c.id}"><b>${esc(c.name)}</b><span class="sub">${c.kind === "outside" ? `${c.running} out at the vendor · ${c.here} ready to send` : `${c.running} running · ${c.here} here and ready${c.held ? ` · ${c.held} held` : ""} · ${c.coming} coming${c.days_of_work_here != null ? `<br>${c.days_of_work_here} days of work waiting here` : ""}`}</span></a>`).join("")}</div>`;
}
function card(x, kind, out, first) {
  const missed = x.missed ? `<span class="red">Locked start ${short(x.locked_start)}: missed.</span>` : x.locked_start ? `Locked start ${short(x.locked_start)}.` : "";
  const meta = `${x.what ? esc(x.what) + " · " : ""}${out ? "" : hrs(x.hours) + " · "}Commit ${short(x.commit_date)} ${pill(x.state)}${x.hot ? ' <span class="pill hot">HOT</span>' : ""}<br>${missed}` +
    (kind === "here" && x.waited_days >= 1 ? ` Here ${plural(Math.floor(x.waited_days), "day")}.` : "") +
    (kind === "coming" ? ` Now at ${esc(x.from || "")}. Planned here ${short(x.plan_start)}.` : "") +
    (kind === "held" ? `<br><b>Held:</b> ${esc(x.hold)}` : "");
  let buttons = "";
  if (kind === "running") buttons = `<button class="go" onclick="done(${x.op_id})">${out ? "Back from the vendor" : "Done: send it on"}</button>`;
  if (kind === "here") buttons = `<button class="${first ? "main" : "quiet"}" onclick="start(${x.op_id})">${out ? "Sent out" : "Start"}</button><button class="quiet" onclick="hold(${x.job_id})">Can't run it</button>`;
  return `<div class="job ${first ? "first" : ""}"><div class="no">${esc(x.job_no)}${first ? '<span class="tag">NEXT UP</span>' : ""}</div>
    <div class="line">${esc(x.part_no || "")} ${esc(x.description || "")} · <b>${x.qty} pcs</b></div><div class="meta">${meta}</div>
    ${buttons ? `<div class="row">${buttons}</div>` : ""}<div class="meta"><a href="${base}/job/${x.job_id}">The whole job</a></div></div>`;
}
async function one() {
  const r = await api(`/api/center/${cid}`);
  const c = r.center, out = c.kind === "outside";
  document.getElementById("title").textContent = c.name;
  document.title = c.name;
  const wk = c.load[0];
  const pct = wk && wk.capacity ? Math.round((100 * wk.hours) / wk.capacity) : null;
  document.getElementById("app").innerHTML = `<div class="who"><span class="sub">Your name</span><input id="name" value="${esc(myName())}" placeholder="So the job's history says who" onchange="setName(this.value)"> <a href="${base}/centers" class="sub" style="margin-left:auto">Other work centers</a></div>
    ${pct != null ? `<div class="card"><b>This week:</b> ${hrs(wk.hours)} booked of ${hrs(wk.capacity)} left in the week (${pct}%)<div class="bar"><i class="${pct >= 95 ? "over" : pct > 80 ? "near" : ""}" style="width:${Math.min(100, pct)}%"></i></div></div>` : ""}
    <h2 class="sec" id="running">${out ? "Out at the vendor" : "Running now"} (${c.running.length})</h2>${c.running.map(x => card(x, "running", out)).join("") || '<p class="sub">Nothing.</p>'}
    <h2 class="sec" id="here">${out ? "Ready to send" : "Here and ready, in order"} (${c.here.length})</h2>${c.here.map((x, i) => card(x, "here", out, i === 0)).join("") || '<p class="sub">Nothing is here.</p>'}
    ${c.held.length ? `<h2 class="sec">Here but held (${c.held.length})</h2>${c.held.map(x => card(x, "held", out)).join("")}` : ""}
    <h2 class="sec" id="coming">Coming (${c.coming.length})</h2>${c.coming.slice(0, 15).map(x => card(x, "coming", out)).join("") || '<p class="sub">Nothing on its way.</p>'}`;
}
async function start(op) { await act(`/api/ops/${op}/start`, {}, "Started.", one); }
async function done(op) { await act(`/api/ops/${op}/done`, {}, null, async (j) => { say(j.shipped ? "Done. That was the last operation: shipped." : "Done. It shows at the next work center now."); await one(); }); }
async function hold(job) { const why = prompt("What is in the way? (material, a drawing, tooling, a question)"); if (why) await act(`/api/jobs/${job}/hold`, { reason: why }, "Held. The office sees it on the board.", one); }
(cid ? one() : picker()).catch(e => say(e.message, true));
if (cid) setInterval(() => one().catch(() => {}), 60000);
</script>
</body>
</html>
